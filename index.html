<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="Memo"/>
<title>Memo</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0f0f0f;--s1:#1a1a1a;--s2:#242424;--s3:#2e2e2e;--t1:#f0f0f0;--t2:rgba(240,240,240,0.5);--t3:rgba(240,240,240,0.22);--acc:#f5c518;--re:#ff4444;--gr:#22c55e;--bl:#3b82f6;--nav:60px;--safe:env(safe-area-inset-bottom,0px);--top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;-webkit-font-smoothing:antialiased;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
#pages{flex:1;overflow:hidden;position:relative;}
.pg{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:calc(var(--top)+4px) 0 calc(var(--nav)+var(--safe)+12px);display:none;}
.pg.on{display:block;}
::-webkit-scrollbar{width:0;}
nav{height:calc(var(--nav)+var(--safe));padding-bottom:var(--safe);background:rgba(15,15,15,0.95);backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,0.06);display:flex;flex-shrink:0;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:none;border:none;color:var(--t3);cursor:pointer;font-family:'DM Sans',sans-serif;font-size:10px;font-weight:500;padding-top:6px;-webkit-tap-highlight-color:transparent;}
.nb.on{color:var(--acc);}
.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.nb.on svg{stroke-width:2.2;}
.wrap{padding:0 16px;}
.field{background:var(--s1);border-radius:14px;margin-bottom:8px;display:flex;align-items:flex-start;overflow:hidden;transition:background 0.14s;}
.field.focus{background:var(--s2);}
.field-ico{padding:14px 0 14px 14px;font-size:16px;flex-shrink:0;opacity:0.5;line-height:1.5;}
.field input,.field textarea{display:block;width:100%;background:transparent;border:none;color:var(--t1);font-family:'DM Sans',sans-serif;font-size:15px;padding:14px 10px;outline:none;-webkit-appearance:none;resize:none;line-height:1.5;}
.field textarea{min-height:52px;}
.field input::placeholder,.field textarea::placeholder{color:var(--t3);}
.field-btn{background:none;border:none;color:var(--t3);font-size:16px;padding:0 12px;cursor:pointer;flex-shrink:0;align-self:center;-webkit-tap-highlight-color:transparent;}
.sug-box{background:var(--s2);border-radius:10px;overflow:hidden;margin-bottom:8px;display:none;}
.sug-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.05);}
.sug-item:last-child{border-bottom:none;}
.sug-item:active{background:var(--s3);}
.sug-name{font-size:13px;font-weight:600;color:var(--t1);}
.sug-addr{font-size:11px;color:var(--t2);margin-top:1px;}
.btn-save{display:block;width:100%;background:var(--acc);border:none;border-radius:14px;color:#000;font-family:'DM Sans',sans-serif;font-weight:700;font-size:16px;padding:16px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn-save:active{opacity:0.85;}
.drafts-bar{background:var(--s1);border-radius:14px;padding:12px;margin-bottom:8px;display:none;}
.draft-item{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.draft-item:last-child{border-bottom:none;}
.draft-time{font-family:'DM Mono',monospace;font-size:11px;color:var(--t2);}
.draft-name{font-size:13px;font-weight:600;flex:1;color:var(--t1);}
.btn-resume{background:rgba(245,197,24,0.1);border:none;border-radius:8px;color:var(--acc);font-size:11px;font-weight:600;padding:5px 10px;cursor:pointer;}
.histo-header{padding:8px 16px 8px;}
.histo-title{font-size:22px;font-weight:700;}
.histo-count{font-size:12px;color:var(--t3);margin-top:2px;}
.search-wrap{padding:0 16px 10px;}
.search-inp{display:block;width:100%;background:var(--s1);border:none;border-radius:12px;color:var(--t1);font-family:'DM Sans',sans-serif;font-size:14px;padding:11px 14px;outline:none;-webkit-appearance:none;}
.search-inp::placeholder{color:var(--t3);}
.day-group{padding:0 16px;margin-bottom:18px;}
.day-label{font-size:11px;color:var(--t3);font-weight:600;letter-spacing:0.08em;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.day-dot{width:4px;height:4px;border-radius:50%;background:var(--acc);display:inline-block;}
.inter-card{background:var(--s1);border-radius:14px;margin-bottom:6px;overflow:hidden;cursor:pointer;}
.inter-card:active{background:var(--s2);}
.card-main{padding:12px 14px;}
.card-row1{display:flex;align-items:center;gap:7px;margin-bottom:5px;flex-wrap:wrap;}
.card-bon{font-family:'DM Mono',monospace;font-size:11px;color:var(--t3);}
.card-time{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--acc);}
.card-lieu{font-size:15px;font-weight:600;flex:1;}
.time-badge{font-family:'DM Mono',monospace;font-size:11px;padding:2px 7px;border-radius:5px;}
.t-arr{background:rgba(34,197,94,0.1);color:#22c55e;}
.t-dep{background:rgba(59,130,246,0.1);color:#3b82f6;}
.card-addr{font-size:12px;color:var(--t2);margin-bottom:4px;}
.card-notes{font-size:12px;color:var(--t2);line-height:1.6;white-space:pre-line;}
.card-codes{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.code-chip{background:rgba(245,197,24,0.1);border:1px solid rgba(245,197,24,0.15);border-radius:7px;padding:4px 10px;font-family:'DM Mono',monospace;font-size:11px;color:var(--acc);}
.card-expanded{padding:0 14px 12px;border-top:1px solid rgba(255,255,255,0.05);}
.card-actions{display:flex;gap:8px;margin-top:10px;}
.btn-del{padding:7px 14px;background:rgba(255,68,68,0.08);border:none;border-radius:9px;color:var(--re);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;}
.btn-dup{padding:7px 14px;background:var(--s2);border:none;border-radius:9px;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;cursor:pointer;}
.empty{text-align:center;color:var(--t3);font-size:13px;padding:60px 20px;line-height:2;}
.circuit-card{background:var(--s1);border-radius:14px;margin-bottom:10px;overflow:hidden;}
.circuit-head{padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.circuit-title{font-size:15px;font-weight:700;color:var(--t1);}
.circuit-meta{font-size:11px;color:var(--t3);margin-top:2px;}
.circuit-body{border-top:1px solid rgba(255,255,255,0.05);}
.site-row{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:flex-start;gap:12px;}
.site-row:last-child{border-bottom:none;}
.site-name{font-size:13px;font-weight:600;color:var(--t1);}
.site-addr{font-size:11px;color:var(--t2);margin-top:2px;}
.site-codes{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px;}
#toast{position:fixed;bottom:calc(var(--nav)+var(--safe)+12px);left:50%;transform:translateX(-50%);background:var(--gr);color:#fff;font-family:'DM Sans',sans-serif;font-weight:700;font-size:13px;padding:10px 20px;border-radius:12px;display:none;z-index:999;white-space:nowrap;pointer-events:none;}
#sov{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(6px);z-index:600;align-items:center;justify-content:center;}
#sov.show{display:flex;}
.sov-c{width:80px;height:80px;border-radius:50%;background:var(--gr);display:flex;align-items:center;justify-content:center;}
</style>
</head>
<body>
<div id="app">
<div id="pages">

<div class="pg on" id="p-saisie">
  <div style="padding:4px 16px 6px">
    <div style="background:var(--s1);border-radius:14px;padding:10px 12px;">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px">
        <div>
          <div id="h-label" style="font-size:9px;color:var(--t3);text-transform:uppercase;font-weight:600;letter-spacing:0.08em;margin-bottom:5px">Heure d'appel</div>
          <div id="h-display" style="font-family:'DM Mono',monospace;font-size:28px;font-weight:500;color:var(--t3)">--h--</div>
          <div id="h-recap" style="font-size:11px;color:var(--t3);margin-top:3px;min-height:14px"></div>
        </div>
        <button id="btn-cycle" onclick="cycleHeure()" style="background:rgba(245,197,24,0.1);border:1px solid rgba(245,197,24,0.2);border-radius:12px;color:var(--acc);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:11px 15px;cursor:pointer;white-space:nowrap;flex-shrink:0;-webkit-tap-highlight-color:transparent">&#9201; Maintenant</button>
      </div>
      <div style="display:flex;gap:8px">
        <div style="flex:1">
          <div style="font-size:9px;color:var(--t3);text-transform:uppercase;font-weight:600;letter-spacing:0.08em;margin-bottom:4px">Appel</div>
          <input id="m-appel" type="text" placeholder="00h00" maxlength="5" style="width:100%;background:var(--s2);border:none;border-radius:9px;color:var(--acc);font-family:'DM Mono',monospace;font-size:15px;font-weight:500;padding:7px 10px;outline:none;text-align:center" oninput="onManualH('appel',this.value)" onblur="formatH('appel',this)"/>
        </div>
        <div style="flex:1">
          <div style="font-size:9px;color:var(--t3);text-transform:uppercase;font-weight:600;letter-spacing:0.08em;margin-bottom:4px">Arriv&#233;e</div>
          <input id="m-arrivee" type="text" placeholder="00h00" maxlength="5" style="width:100%;background:var(--s2);border:none;border-radius:9px;color:#22c55e;font-family:'DM Mono',monospace;font-size:15px;font-weight:500;padding:7px 10px;outline:none;text-align:center" oninput="onManualH('arrivee',this.value)" onblur="formatH('arrivee',this)"/>
        </div>
        <div style="flex:1">
          <div style="font-size:9px;color:var(--t3);text-transform:uppercase;font-weight:600;letter-spacing:0.08em;margin-bottom:4px">D&#233;part</div>
          <input id="m-depart" type="text" placeholder="00h00" maxlength="5" style="width:100%;background:var(--s2);border:none;border-radius:9px;color:#3b82f6;font-family:'DM Mono',monospace;font-size:15px;font-weight:500;padding:7px 10px;outline:none;text-align:center" oninput="onManualH('depart',this.value)" onblur="formatH('depart',this)"/>
        </div>
      </div>
    </div>
  </div>
  <div class="wrap">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding:0 2px">
      <div id="bon-wrap" style="font-size:11px;color:var(--t3);font-family:'DM Mono',monospace">N&#176; bon : <span id="bon-num" style="color:var(--acc)">--</span></div>
      <button onclick="toggleBon()" id="bon-toggle" style="background:var(--s2);border:none;border-radius:8px;color:var(--t3);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;padding:4px 10px;cursor:pointer;-webkit-tap-highlight-color:transparent">Sans bon</button>
    </div>
    <div id="inop-warn" style="display:none;align-items:center;gap:10px;background:rgba(255,68,68,0.08);border:1px solid rgba(255,68,68,0.2);border-radius:12px;padding:10px 14px;margin-bottom:8px">
      <span style="font-size:18px">&#9888;&#65039;</span>
      <span style="font-size:12px;color:#ff6b6b;font-weight:600;line-height:1.4">Moyen d'acc&#232;s inop&#233;rant<br><span style="font-weight:400;opacity:0.8">signal&#233; lors de la derni&#232;re inter sur ce site</span></span>
    </div>
    <div class="drafts-bar" id="drafts-bar"></div>
    <div class="field" id="fw-pc">
      <span class="field-ico">&#128225;</span>
      <input type="text" id="f-pc" placeholder="PC t&#233;l&#233;surveillance..." autocomplete="off" oninput="onPcInput();saveFormAuto()" onfocus="focusF('fw-pc')" onblur="blurF('fw-pc')" style="text-transform:uppercase"/>
    </div>
    <div class="sug-box" id="pc-sug"></div>
    <div class="field" id="fw-lieu">
      <span class="field-ico">&#128205;</span>
      <input type="text" id="f-lieu" placeholder="Nom du site..." autocomplete="off" oninput="onLieuInput();saveFormAuto()" onfocus="focusF('fw-lieu')" onblur="blurF('fw-lieu')"/>
    </div>
    <div class="sug-box" id="lieu-sug"></div>
    <div class="field" id="fw-adr">
      <span class="field-ico">&#127968;</span>
      <input type="text" id="f-adr" placeholder="Adresse (optionnel)..." onfocus="focusF('fw-adr')" onblur="blurF('fw-adr')" oninput="saveFormAuto()"/>
      <button class="field-btn" onclick="openWaze()" style="font-size:13px;font-weight:700;color:#33ccff;padding:0 10px">W</button>
      <button class="field-btn" id="geo-btn" onclick="geolocate()">&#128205;</button>
    </div>
    <div class="field" id="fw-raison">
      <span class="field-ico">&#9889;</span>
      <input type="text" id="f-raison" placeholder="Raison d'intervention..." autocomplete="off" oninput="onRaisonInput();saveFormAuto()" onfocus="focusF('fw-raison')" onblur="blurF('fw-raison')"/>
    </div>
    <div id="raison-sug" style="display:none;margin-bottom:8px;padding:0 2px"></div>
    <div class="field" id="fw-codes">
      <span class="field-ico">&#128273;</span>
      <input type="text" id="f-codes" placeholder="gs381, code cadenas 288, clef 1f68..." onfocus="focusF('fw-codes')" onblur="blurF('fw-codes')" oninput="saveFormAuto();renderCodesPreview()"/>
    </div>
    <div id="codes-preview" style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;padding:0 2px"></div>
    <div class="field" id="fw-notes">
      <span class="field-ico">&#128221;</span>
      <textarea id="f-notes" placeholder="Notes libres... d&#233;tails, r&#233;sultat, TSN..." rows="3" onfocus="focusF('fw-notes')" onblur="blurF('fw-notes')" oninput="saveFormAuto()"></textarea>
    </div>
    <div style="display:flex;gap:8px">
      <button onclick="saveDraft()" style="flex:1;padding:16px;background:var(--s2);border:none;border-radius:14px;color:var(--t2);font-family:'DM Sans',sans-serif;font-weight:600;font-size:14px;cursor:pointer;-webkit-tap-highlight-color:transparent">&#9208; Attente</button>
      <button class="btn-save" onclick="saveInter()" style="flex:2">Enregistrer</button>
    </div>
  </div>
</div>

<div class="pg" id="p-histo">
  <div class="histo-header">
    <div class="histo-title">Historique</div>
    <div class="histo-count" id="histo-count"></div>
  </div>
  <div class="search-wrap">
    <input class="search-inp" id="search" placeholder="&#128269; Rechercher..." oninput="renderHisto()"/>
  </div>
  <div id="histo-list"></div>
  <div style="display:flex;gap:8px;padding:16px">
    <button onclick="exportData()" style="flex:1;background:var(--s1);border:none;border-radius:12px;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:13px;cursor:pointer">&#8595; Backup</button>
    <button onclick="importData()" style="flex:1;background:var(--s1);border:none;border-radius:12px;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:13px;cursor:pointer">&#8593; Restore</button>
  </div>
</div>

<div class="pg" id="p-rondes">
  <div class="histo-header">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div class="histo-title">Rondes</div>
      <button onclick="showNewCircuit()" style="background:rgba(245,197,24,0.1);border:1px solid rgba(245,197,24,0.2);border-radius:10px;color:var(--acc);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:8px 14px;cursor:pointer">+ Circuit</button>
    </div>
  </div>
  <div id="rondes-list" style="padding:0 16px"></div>
</div>

</div>

<nav>
  <button class="nb on" id="nb-saisie" onclick="go('saisie')">
    <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4 9.5-9.5z"/></svg>Saisie
  </button>
  <button class="nb" id="nb-histo" onclick="go('histo')">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 15"/></svg>Historique
  </button>
  <button class="nb" id="nb-rondes" onclick="go('rondes')">
    <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>Rondes
  </button>
</nav>

<div id="circuit-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:800;align-items:flex-end;justify-content:center">
  <div style="background:#1a1a1a;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:500px;padding-bottom:calc(24px + env(safe-area-inset-bottom))">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:17px;font-weight:700;color:var(--t1)">Nouveau circuit</div>
      <button onclick="closeCircuitModal()" style="background:var(--s2);border:none;border-radius:50%;width:30px;height:30px;color:var(--t3);font-size:16px;cursor:pointer">&#215;</button>
    </div>
    <div style="background:var(--s2);border-radius:12px;display:flex;align-items:center;margin-bottom:12px">
      <span style="padding:0 12px;font-size:16px;opacity:0.5">&#128203;</span>
      <input id="circuit-name" type="text" placeholder="Nom du circuit (ex: Samedi nuit)..." style="flex:1;background:transparent;border:none;color:var(--t1);font-family:'DM Sans',sans-serif;font-size:15px;padding:13px 13px 13px 0;outline:none"/>
    </div>
    <button onclick="saveCircuit()" style="display:block;width:100%;background:var(--acc);border:none;border-radius:12px;color:#000;font-family:'DM Sans',sans-serif;font-weight:700;font-size:15px;padding:14px;cursor:pointer">Cr&#233;er</button>
  </div>
</div>

<div id="site-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:800;align-items:flex-end;justify-content:center">
  <div style="background:#1a1a1a;border-radius:20px 20px 0 0;padding:24px;width:100%;max-width:500px;padding-bottom:calc(24px + env(safe-area-inset-bottom))">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div style="font-size:17px;font-weight:700;color:var(--t1)">Ajouter un site</div>
      <button onclick="closeSiteModal()" style="background:var(--s2);border:none;border-radius:50%;width:30px;height:30px;color:var(--t3);font-size:16px;cursor:pointer">&#215;</button>
    </div>
    <div style="background:var(--s2);border-radius:12px;display:flex;align-items:center;margin-bottom:8px">
      <span style="padding:0 12px;font-size:16px;opacity:0.5">&#128205;</span>
      <input id="site-nom" type="text" placeholder="Nom du site..." style="flex:1;background:transparent;border:none;color:var(--t1);font-family:'DM Sans',sans-serif;font-size:15px;padding:13px 13px 13px 0;outline:none"/>
    </div>
    <div style="background:var(--s2);border-radius:12px;display:flex;align-items:center;margin-bottom:8px">
      <span style="padding:0 12px;font-size:16px;opacity:0.5">&#127968;</span>
      <input id="site-adr" type="text" placeholder="Adresse (optionnel)..." style="flex:1;background:transparent;border:none;color:var(--t1);font-family:'DM Sans',sans-serif;font-size:15px;padding:13px 13px 13px 0;outline:none"/>
    </div>
    <div style="background:var(--s2);border-radius:12px;display:flex;align-items:center;margin-bottom:12px">
      <span style="padding:0 12px;font-size:16px;opacity:0.5">&#128273;</span>
      <input id="site-codes" type="text" placeholder="Codes, clefs... (gs381, clef 1f68)" style="flex:1;background:transparent;border:none;color:var(--t1);font-family:'DM Sans',sans-serif;font-size:15px;padding:13px 13px 13px 0;outline:none"/>
    </div>
    <button onclick="saveSite()" style="display:block;width:100%;background:var(--acc);border:none;border-radius:12px;color:#000;font-family:'DM Sans',sans-serif;font-weight:700;font-size:15px;padding:14px;cursor:pointer">Ajouter</button>
  </div>
</div>

<div id="circuit-actif-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:900;overflow-y:auto;padding:calc(var(--top)+12px) 16px calc(var(--safe)+16px)">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
    <div id="ca-title" style="font-size:19px;font-weight:700;color:var(--t1)"></div>
    <button onclick="closeCircuitActif()" style="background:var(--s2);border:none;border-radius:10px;color:var(--t2);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;padding:8px 14px;cursor:pointer">&#215; Fermer</button>
  </div>
  <div id="ca-codes" style="background:var(--s1);border-radius:14px;padding:14px;margin-bottom:12px"></div>
  <div id="ca-sites"></div>
</div>

</div>
<div id="sov"><div class="sov-c"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div></div>
<div id="toast"></div>

<script>
const SK='memo_ivs';
const lsGet=k=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):null;}catch(e){return null;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}};
const today=()=>new Date().toISOString().slice(0,10);
const nowTime=()=>{const n=new Date();return String(n.getHours()).padStart(2,'0')+'h'+String(n.getMinutes()).padStart(2,'0');};
const fmtD=d=>{if(!d)return'';const[y,m,day]=d.split('-');return day+'/'+m+'/'+y;};

let ivs=lsGet(SK)||[];
let opens=new Set();
let drafts=lsGet('memo_drafts')||[];
let circuits=lsGet('memo_circuits')||[];

let _withBon=true;
function nextBon(){
  if(!ivs.length)return'54801';
  const nums=ivs.map(i=>parseInt(i.bon,10)).filter(n=>!isNaN(n)&&n>=54800);
  if(!nums.length)return'54801';
  const last=Math.max(...nums),suf=parseInt(String(last).slice(3),10)+1;
  return'548'+(suf<10?'0'+suf:String(suf));
}
function refreshBon(){document.getElementById('bon-num').textContent=nextBon();}
function toggleBon(){
  _withBon=!_withBon;
  const btn=document.getElementById('bon-toggle'),wrap=document.getElementById('bon-wrap');
  if(_withBon){btn.textContent='Sans bon';btn.style.color='var(--t3)';wrap.style.opacity='1';}
  else{btn.textContent='Avec bon';btn.style.color='var(--acc)';wrap.style.opacity='0.3';}
}

let _step=0,hAppel='',hArrivee='',hDepart='';
function cycleHeure(){
  const t=nowTime();
  const lbl=document.getElementById('h-label'),disp=document.getElementById('h-display'),recap=document.getElementById('h-recap'),btn=document.getElementById('btn-cycle');
  if(_step===0){hAppel=t;_step=1;lbl.textContent="Heure d'appel";disp.textContent=t;disp.style.color='var(--acc)';recap.textContent='';btn.textContent='Arrivee';const ma=document.getElementById('m-appel');if(ma)ma.value=t;toast('Appel '+t);saveFormAuto();}
  else if(_step===1){hArrivee=t;_step=2;lbl.textContent='Arrivee sur site';disp.textContent=t;disp.style.color='#22c55e';recap.textContent='Appel '+hAppel;btn.textContent='Depart';const mb=document.getElementById('m-arrivee');if(mb)mb.value=t;toast('Arrivee '+t);saveFormAuto();}
  else if(_step===2){hDepart=t;_step=3;lbl.textContent='Depart';disp.textContent=t;disp.style.color='#3b82f6';recap.textContent=hAppel+' / '+hArrivee;btn.textContent='Complet';btn.style.opacity='0.5';const mc=document.getElementById('m-depart');if(mc)mc.value=t;toast('Depart '+t);saveFormAuto();}
}
function onManualH(field,val){
  if(field==='appel')hAppel=val;
  else if(field==='arrivee')hArrivee=val;
  else if(field==='depart')hDepart=val;
  syncHeureDisplay();saveFormAuto();
}
function formatH(field,input){
  let v=input.value.replace('h','').replace(':','').trim();
  if(/^\d{3,4}$/.test(v)){v=v.padStart(4,'0');v=v.slice(0,2)+'h'+v.slice(2);input.value=v;if(field==='appel')hAppel=v;else if(field==='arrivee')hArrivee=v;else if(field==='depart')hDepart=v;}
  syncHeureDisplay();
}
function syncHeureDisplay(){
  const lbl=document.getElementById('h-label'),disp=document.getElementById('h-display'),recap=document.getElementById('h-recap');
  if(hDepart){lbl.textContent='Depart';disp.textContent=hDepart;disp.style.color='#3b82f6';recap.textContent=hAppel+' / '+hArrivee;}
  else if(hArrivee){lbl.textContent='Arrivee sur site';disp.textContent=hArrivee;disp.style.color='#22c55e';recap.textContent='Appel '+hAppel;}
  else if(hAppel){lbl.textContent="Heure d'appel";disp.textContent=hAppel;disp.style.color='var(--acc)';recap.textContent='';}
  else{lbl.textContent="Heure d'appel";disp.textContent='--h--';disp.style.color='var(--t3)';recap.textContent='';}
}
function resetHeure(){
  _step=0;hAppel='';hArrivee='';hDepart='';
  document.getElementById('h-label').textContent="Heure d'appel";
  document.getElementById('h-display').textContent='--h--';
  document.getElementById('h-display').style.color='var(--t3)';
  document.getElementById('h-recap').textContent='';
  const btn=document.getElementById('btn-cycle');btn.textContent='Maintenant';btn.style.opacity='1';
  const ma=document.getElementById('m-appel');if(ma)ma.value='';
  const mb=document.getElementById('m-arrivee');if(mb)mb.value='';
  const mc=document.getElementById('m-depart');if(mc)mc.value='';
}

function geolocate(){
  const btn=document.getElementById('geo-btn');
  if(!navigator.geolocation){toast('Geoloc non supportee');return;}
  btn.textContent='...';
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const lat=pos.coords.latitude.toFixed(5),lng=pos.coords.longitude.toFixed(5);
      fetch('https://nominatim.openstreetmap.org/reverse?format=json&lat='+lat+'&lon='+lng+'&accept-language=fr')
        .then(r=>r.json()).then(d=>{
          const a=d.address||{};
          const adr=[a.house_number||'',a.road||'',a.postcode||'',a.city||a.town||a.village||''].filter(Boolean).join(' ');
          if(adr)document.getElementById('f-adr').value=adr.trim();
          btn.textContent='OK';setTimeout(()=>btn.textContent='Pin',2000);
          toast('Position trouvee');saveFormAuto();
        }).catch(()=>{btn.textContent='Pin';});
    },
    err=>{btn.textContent='Pin';toast(err.code===1?'Autorisation refusee':'Position indisponible');},
    {timeout:10000,enableHighAccuracy:true}
  );
}

function openWaze(){
  const adr=document.getElementById('f-adr').value.trim();
  if(!adr){toast('Remplis adresse');return;}
  window.open('https://waze.com/ul?q='+encodeURIComponent(adr)+'&navigate=yes','_blank');
}

const RAISONS=['Intrusion','Detecteur','Ouverture porte','Detecteur fumee','Chute de personne','Alarme peripherique','Multiple declenchement','Ronde','Volumetrique','Bris de vitre'];
function onRaisonInput(){
  var q=document.getElementById('f-raison').value.trim().toLowerCase();
  var box=document.getElementById('raison-sug');
  if(q.length<2){box.style.display='none';return;}
  var seen={};
  var fromH=ivs.filter(function(it){if(!it.raison)return false;var k=it.raison.toLowerCase();if(seen[k])return false;if(!k.startsWith(q))return false;seen[k]=true;return true;}).map(function(it){return it.raison;});
  var fromF=RAISONS.filter(function(r){return r.toLowerCase().startsWith(q)&&!seen[r.toLowerCase()];});
  var sugs=fromH.concat(fromF).slice(0,4);
  if(!sugs.length){box.style.display='none';return;}
  var html='';
  sugs.forEach(function(s){
    html+='<button onclick="document.getElementById(\'f-raison\').value=\''+s+'\';document.getElementById(\'raison-sug\').style.display=\'none\';saveFormAuto()" style="background:var(--s2);border:none;border-radius:8px;color:var(--t1);font-size:12px;padding:6px 12px;cursor:pointer;margin-right:5px;margin-bottom:4px">'+s+'</button>';
  });
  box.innerHTML=html;
  box.style.display='block';
}
function applyRaison(btn){
  document.getElementById('f-raison').value=btn.dataset.val;
  document.getElementById('raison-sug').style.display='none';
  saveFormAuto();
}
function checkInoperant(lieu){
  if(!lieu)return;
  const match=ivs.filter(it=>it.lieu&&it.lieu.toLowerCase()===lieu.toLowerCase()&&it.notes);
  const hasInop=match.some(it=>it.notes.toLowerCase().includes('inop'));
  const warn=document.getElementById('inop-warn');
  if(warn)warn.style.display=hasInop?'flex':'none';
}
function checkNoBon(lieu){
  if(!lieu)return;
  const match=ivs.filter(it=>it.lieu&&it.lieu.toLowerCase()===lieu.toLowerCase());
  if(!match.length)return;
  const noBonCount=match.filter(it=>!it.bon||it.bon==='').length;
  if(noBonCount>0&&noBonCount>=match.length*0.5){
    _withBon=false;
    const btn=document.getElementById('bon-toggle'),wrap=document.getElementById('bon-wrap');
    if(btn){btn.textContent='Avec bon';btn.style.color='var(--acc)';}
    if(wrap)wrap.style.opacity='0.3';
  }
}

function renderCodesPreview(){
  const val=document.getElementById('f-codes').value;
  const chips=val.split(',').map(s=>s.trim()).filter(Boolean);
  const el=document.getElementById('codes-preview');
  if(!chips.length){el.innerHTML='';return;}
  el.innerHTML=chips.map(c=>'<span class="code-chip">'+c+'</span>').join('');
}

function go(id){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('p-'+id).classList.add('on');
  document.getElementById('nb-'+id).classList.add('on');
  if(id==='histo')renderHisto();
  if(id==='rondes')renderRondes();
  if(id==='saisie'){renderDrafts();refreshBon();}
}
function focusF(id){document.getElementById(id).classList.add('focus');}
function blurF(id){setTimeout(()=>document.getElementById(id).classList.remove('focus'),150);}

function onPcInput(){
  const q=document.getElementById('f-pc').value.trim().toLowerCase();
  const box=document.getElementById('pc-sug');
  if(q.length<1){box.style.display='none';return;}
  const seen={};
  const matches=ivs.filter(it=>{if(!it.pc)return false;const k=it.pc.toLowerCase();if(seen[k])return false;if(!k.includes(q))return false;seen[k]=true;return true;}).slice(0,4);
  if(!matches.length){box.style.display='none';return;}
  box.innerHTML=matches.map(function(m){return '<div class="sug-item" style="cursor:pointer" onclick="applyPc(\''+m.pc+'\')">'+'<div class="sug-name">'+m.pc+'</div></div>';}).join('');
  box.style.display='block';
}
function applyPc(pc){document.getElementById('f-pc').value=pc;document.getElementById('pc-sug').style.display='none';}

function onLieuInput(){
  const q=document.getElementById('f-lieu').value.trim().toLowerCase();
  const box=document.getElementById('lieu-sug');
  if(q.length<2){box.style.display='none';return;}
  const seen={};
  const matches=ivs.filter(it=>{if(!it.lieu)return false;const k=it.lieu.toLowerCase();if(seen[k])return false;if(!k.includes(q))return false;seen[k]=true;return true;}).slice(0,4);
  if(!matches.length){box.style.display='none';return;}
  box.innerHTML=matches.map(it=>'<div class="sug-item" onclick="applySug('+it.id+')"><div class="sug-name">'+it.lieu+'</div>'+(it.adresse?'<div class="sug-addr">'+it.adresse+'</div>':'')+'</div>').join('');
  box.style.display='block';
}
function applySug(id){
  const src=ivs.find(i=>i.id===id);if(!src)return;
  document.getElementById('f-pc').value=src.pc||'';
  document.getElementById('f-lieu').value=src.lieu||'';
  document.getElementById('f-adr').value=src.adresse||'';
  document.getElementById('f-codes').value=src.codes||'';
  renderCodesPreview();
  document.getElementById('lieu-sug').style.display='none';
  checkInoperant(src.lieu);
  checkNoBon(src.lieu);
  toast('Infos pre-remplies');
}

function saveFormAuto(){
  lsSet('memo_form',{
    hAppel,hArrivee,hDepart,_step,_withBon,
    pc:document.getElementById('f-pc').value,
    lieu:document.getElementById('f-lieu').value,
    adresse:document.getElementById('f-adr').value,
    raison:document.getElementById('f-raison').value,
    codes:document.getElementById('f-codes').value,
    notes:document.getElementById('f-notes').value,
  });
}
function restoreForm(){
  const saved=lsGet('memo_form');
  if(!saved)return;
  if(!(saved.lieu||saved.hAppel||saved.codes||saved.notes||saved.raison||saved.adresse||saved.pc))return;
  hAppel=saved.hAppel||'';hArrivee=saved.hArrivee||'';hDepart=saved.hDepart||'';_step=saved._step||0;
  if(saved._withBon===false){_withBon=false;const btn=document.getElementById('bon-toggle');const wrap=document.getElementById('bon-wrap');if(btn){btn.textContent='Avec bon';btn.style.color='var(--acc)';}if(wrap)wrap.style.opacity='0.3';}
  const ma=document.getElementById('m-appel');if(ma&&hAppel)ma.value=hAppel;
  const mb=document.getElementById('m-arrivee');if(mb&&hArrivee)mb.value=hArrivee;
  const mc=document.getElementById('m-depart');if(mc&&hDepart)mc.value=hDepart;
  syncHeureDisplay();
  const btn=document.getElementById('btn-cycle');
  if(_step===3){btn.textContent='Complet';btn.style.opacity='0.5';}
  else if(_step===2)btn.textContent='Depart';
  else if(_step===1)btn.textContent='Arrivee';
  if(saved.pc){document.getElementById('f-pc').value=saved.pc;}
  if(saved.lieu){document.getElementById('f-lieu').value=saved.lieu;checkInoperant(saved.lieu);}
  if(saved.adresse)document.getElementById('f-adr').value=saved.adresse;
  if(saved.raison)document.getElementById('f-raison').value=saved.raison;
  if(saved.codes){document.getElementById('f-codes').value=saved.codes;renderCodesPreview();}
  if(saved.notes){const fn=document.getElementById('f-notes');fn.value=saved.notes;fn.style.height='auto';fn.style.height=Math.min(fn.scrollHeight,120)+'px';}
}

function saveDraft(){
  const lieu=document.getElementById('f-lieu').value.trim();
  if(!lieu&&!hAppel){toast('Rien a mettre en attente');return;}
  drafts.push({id:Date.now(),hAppel,hArrivee,hDepart,_step,pc:document.getElementById('f-pc').value.trim(),lieu,adresse:document.getElementById('f-adr').value.trim(),raison:document.getElementById('f-raison').value.trim(),codes:document.getElementById('f-codes').value.trim(),notes:document.getElementById('f-notes').value.trim()});
  lsSet('memo_drafts',drafts);resetForm();renderDrafts();toast('Mis en attente');
}
function resumeDraft(id){
  const idx=drafts.findIndex(d=>d.id===id);if(idx===-1)return;
  const d=drafts[idx];
  if(document.getElementById('f-lieu').value.trim()||hAppel)saveDraft();
  drafts.splice(idx,1);lsSet('memo_drafts',drafts);
  hAppel=d.hAppel||'';hArrivee=d.hArrivee||'';hDepart=d.hDepart||'';_step=d._step||0;
  const lbl=document.getElementById('h-label'),disp=document.getElementById('h-display'),recap=document.getElementById('h-recap'),btn=document.getElementById('btn-cycle');
  if(_step===3){lbl.textContent='Depart';disp.textContent=hDepart;disp.style.color='#3b82f6';recap.textContent=hAppel+' / '+hArrivee;btn.textContent='Complet';btn.style.opacity='0.5';}
  else if(_step===2){lbl.textContent='Arrivee';disp.textContent=hArrivee;disp.style.color='#22c55e';recap.textContent='Appel '+hAppel;btn.textContent='Depart';btn.style.opacity='1';}
  else if(_step===1){lbl.textContent="Heure d'appel";disp.textContent=hAppel;disp.style.color='var(--acc)';recap.textContent='';btn.textContent='Arrivee';btn.style.opacity='1';}
  else resetHeure();
  const ma=document.getElementById('m-appel');if(ma)ma.value=hAppel||'';
  const mb=document.getElementById('m-arrivee');if(mb)mb.value=hArrivee||'';
  const mc=document.getElementById('m-depart');if(mc)mc.value=hDepart||'';
  document.getElementById('f-pc').value=d.pc||'';
  document.getElementById('f-lieu').value=d.lieu||'';
  document.getElementById('f-adr').value=d.adresse||'';
  document.getElementById('f-raison').value=d.raison||'';
  document.getElementById('f-codes').value=d.codes||'';
  document.getElementById('f-notes').value=d.notes||'';
  renderCodesPreview();renderDrafts();
  if(d.lieu)checkInoperant(d.lieu);
  toast('Inter restauree');
}
function renderDrafts(){
  const el=document.getElementById('drafts-bar');
  if(!drafts.length){el.style.display='none';return;}
  el.style.display='block';
  el.innerHTML='<div style="font-size:10px;color:var(--t3);letter-spacing:0.08em;text-transform:uppercase;font-weight:600;margin-bottom:8px">En attente ('+drafts.length+')</div>'+drafts.map(d=>'<div class="draft-item"><div class="draft-time">'+(d.hAppel||'--')+'</div><div class="draft-name">'+(d.lieu||'Sans lieu')+'</div><button class="btn-resume" onclick="resumeDraft('+d.id+')">Reprendre</button></div>').join('');
}

function saveInter(){
  const lieu=document.getElementById('f-lieu').value.trim();
  if(!lieu){document.getElementById('f-lieu').focus();return;}
  const item={id:Date.now(),bon:_withBon?nextBon():'',date:today(),hAppel:hAppel||nowTime(),hArrivee,hDepart,pc:document.getElementById('f-pc').value.trim().toUpperCase(),lieu,adresse:document.getElementById('f-adr').value.trim(),raison:document.getElementById('f-raison').value.trim(),codes:document.getElementById('f-codes').value.trim(),notes:document.getElementById('f-notes').value.trim()};
  ivs.unshift(item);lsSet(SK,ivs);
  const sov=document.getElementById('sov');sov.classList.add('show');
  setTimeout(()=>{sov.classList.remove('show');resetForm();go('histo');},1400);
}
function resetForm(){
  resetHeure();_withBon=true;
  ['f-pc','f-lieu','f-adr','f-raison','f-codes','f-notes'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('codes-preview').innerHTML='';
  document.getElementById('raison-sug').style.display='none';
  document.getElementById('lieu-sug').style.display='none';
  document.getElementById('pc-sug').style.display='none';
  const iw=document.getElementById('inop-warn');if(iw)iw.style.display='none';
  const btn=document.getElementById('bon-toggle');if(btn){btn.textContent='Sans bon';btn.style.color='var(--t3)';}
  const wrap=document.getElementById('bon-wrap');if(wrap)wrap.style.opacity='1';
  lsSet('memo_form',null);
  refreshBon();
}

function renderHisto(){
  const q=(document.getElementById('search').value||'').toLowerCase().trim();
  document.getElementById('histo-count').textContent=ivs.length+' intervention'+(ivs.length>1?'s':'');
  let f=q?ivs.filter(it=>[it.lieu,it.adresse,it.codes,it.notes,it.bon,it.pc,it.raison].some(s=>s&&s.toLowerCase().includes(q))):ivs;
  const el=document.getElementById('histo-list');
  if(!f.length){el.innerHTML='<div class="empty">Aucune intervention.</div>';return;}
  const groups={};
  f.forEach(it=>{const k=it.date||'--';if(!groups[k])groups[k]=[];groups[k].push(it);});
  const sorted=Object.entries(groups).sort((a,b)=>b[0].localeCompare(a[0]));
  el.innerHTML=sorted.map(([d,items])=>'<div class="day-group"><div class="day-label"><span class="day-dot"></span>'+fmtD(d)+' - '+items.length+' inter'+(items.length>1?'s':'')+'</div>'+items.map(it=>card(it)).join('')+'</div>').join('');
}
function card(it){
  const open=opens.has(it.id);
  const codes=it.codes?it.codes.split(',').map(s=>s.trim()).filter(Boolean):[];
  let h='<div class="inter-card" onclick="tog('+it.id+')">';
  h+='<div class="card-main">';
  h+='<div class="card-row1">';
  if(it.bon)h+='<span class="card-bon">#'+it.bon+'</span>';
  h+='<span class="card-time">'+(it.hAppel||'--')+'</span>';
  if(it.hArrivee)h+='<span class="time-badge t-arr">'+it.hArrivee+'</span>';
  if(it.hDepart)h+='<span class="time-badge t-dep">'+it.hDepart+'</span>';
  h+='<span class="card-lieu">'+(it.lieu||'Sans lieu')+'</span>';
  h+='</div>';
  if(it.pc)h+='<div style="font-size:11px;color:var(--t3);margin-bottom:3px">'+it.pc+'</div>';
  if(it.raison)h+='<div style="display:inline-flex;align-items:center;gap:5px;background:rgba(245,197,24,0.08);border-radius:7px;padding:2px 9px;font-size:11px;color:var(--acc);font-weight:600;margin-bottom:4px">'+it.raison+'</div>';
  if(it.adresse)h+='<div class="card-addr">'+it.adresse+'</div>';
  if(codes.length)h+='<div class="card-codes">'+codes.map(c=>'<span class="code-chip">'+c+'</span>').join('')+'</div>';
  if(it.notes&&!open)h+='<div class="card-notes" style="margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">'+it.notes+'</div>';
  h+='</div>';
  if(open){
    h+='<div class="card-expanded">';
    if(it.notes)h+='<div class="card-notes">'+it.notes+'</div>';
    h+='<div class="card-actions"><button class="btn-dup" onclick="event.stopPropagation();dupInter('+it.id+')">Dupliquer</button><button class="btn-del" onclick="event.stopPropagation();delInter('+it.id+')">Supprimer</button></div>';
    h+='</div>';
  }
  h+='</div>';
  return h;
}
function tog(id){opens.has(id)?opens.delete(id):opens.add(id);renderHisto();}
function delInter(id){ivs=ivs.filter(i=>i.id!==id);opens.delete(id);lsSet(SK,ivs);renderHisto();}
function dupInter(id){
  const src=ivs.find(i=>i.id===id);if(!src)return;
  document.getElementById('f-pc').value=src.pc||'';
  document.getElementById('f-lieu').value=src.lieu||'';
  document.getElementById('f-adr').value=src.adresse||'';
  document.getElementById('f-raison').value=src.raison||'';
  document.getElementById('f-codes').value=src.codes||'';
  document.getElementById('f-notes').value='';
  renderCodesPreview();resetHeure();go('saisie');toast('Pre-rempli');
}

function exportData(){
  const data={version:1,date:today(),ivs,circuits};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b),a=document.createElement('a');
  a.href=u;a.download='memo-backup-'+today()+'.json';a.click();URL.revokeObjectURL(u);
  toast('Backup exporte');
}
function importData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        const list=data.ivs||data;
        if(!Array.isArray(list)){toast('Format invalide');return;}
        let added=0;
        list.forEach(d=>{if(!ivs.find(i=>i.id===d.id)){ivs.push(d);added++;}});
        ivs.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
        lsSet(SK,ivs);
        if(data.circuits&&data.circuits.length){
          data.circuits.forEach(c=>{if(!circuits.find(x=>x.id===c.id))circuits.push(c);});
          lsSet('memo_circuits',circuits);
        }
        toast(added+' inter importees');renderHisto();
      }catch(e){toast('Erreur lecture');}
    };
    reader.readAsText(file);
  };
  inp.click();
}

function saveCircuits(){lsSet('memo_circuits',circuits);}
let openCircuits=new Set();
let _addSiteCircuitId=null;
let _circuitChecks={};

function showNewCircuit(){document.getElementById('circuit-name').value='';document.getElementById('circuit-modal').style.display='flex';}
function closeCircuitModal(){document.getElementById('circuit-modal').style.display='none';}
function saveCircuit(){
  const name=document.getElementById('circuit-name').value.trim();if(!name)return;
  circuits.push({id:Date.now(),name,sites:[]});saveCircuits();closeCircuitModal();renderRondes();
}
function deleteCircuit(id){
  if(!confirm('Supprimer ?'))return;
  circuits=circuits.filter(c=>c.id!==id);saveCircuits();renderRondes();
}
function showAddSite(cId){
  _addSiteCircuitId=cId;
  document.getElementById('site-nom').value='';
  document.getElementById('site-adr').value='';
  document.getElementById('site-codes').value='';
  document.getElementById('site-modal').style.display='flex';
}
function closeSiteModal(){document.getElementById('site-modal').style.display='none';}
function saveSite(){
  const nom=document.getElementById('site-nom').value.trim();if(!nom)return;
  const c=circuits.find(c=>c.id===_addSiteCircuitId);if(!c)return;
  c.sites.push({id:Date.now(),nom,adresse:document.getElementById('site-adr').value.trim(),codes:document.getElementById('site-codes').value.trim()});
  saveCircuits();closeSiteModal();renderRondes();
}
function deleteSite(cId,sId){
  const c=circuits.find(c=>c.id===cId);if(!c)return;
  c.sites=c.sites.filter(s=>s.id!==sId);saveCircuits();renderRondes();
}
function togCircuit(id){openCircuits.has(id)?openCircuits.delete(id):openCircuits.add(id);renderRondes();}

function lancerCircuit(id){
  const c=circuits.find(c=>c.id===id);if(!c)return;
  _circuitChecks={};
  document.getElementById('ca-title').textContent=c.name;
  const codesEl=document.getElementById('ca-codes');
  let codesHtml='<div style="font-size:10px;color:var(--t3);text-transform:uppercase;font-weight:600;letter-spacing:0.08em;margin-bottom:10px">Moyens acces</div>';
  let hasCodes=false;
  c.sites.forEach(s=>{
    const codes=s.codes?s.codes.split(',').map(x=>x.trim()).filter(Boolean):[];
    if(!codes.length)return;
    hasCodes=true;
    codesHtml+='<div style="margin-bottom:8px"><div style="font-size:12px;font-weight:600;color:var(--t1);margin-bottom:4px">'+s.nom+'</div><div style="display:flex;flex-wrap:wrap;gap:4px">'+codes.map(c=>'<span class="code-chip">'+c+'</span>').join('')+'</div></div>';
  });
  if(!hasCodes)codesHtml+='<div style="font-size:13px;color:var(--t3)">Aucun code</div>';
  codesEl.innerHTML=codesHtml;
  renderCircuitChecklist(c);
  document.getElementById('circuit-actif-modal').style.display='block';
}
function renderCircuitChecklist(c){
  const el=document.getElementById('ca-sites');
  let h='<div style="font-size:10px;color:var(--t3);text-transform:uppercase;font-weight:600;letter-spacing:0.08em;margin-bottom:10px">Sites</div>';
  h+=c.sites.map(s=>{
    const done=_circuitChecks[s.id];
    return '<div onclick="toggleCheck('+c.id+','+s.id+')" style="background:'+(done?'rgba(34,197,94,0.08)':'var(--s1)')+';border-radius:14px;padding:13px 15px;margin-bottom:7px;display:flex;align-items:center;gap:12px;cursor:pointer;"><div style="width:24px;height:24px;border-radius:7px;border:2px solid '+(done?'#22c55e':'var(--t3)')+';background:'+(done?'#22c55e':'transparent')+';display:flex;align-items:center;justify-content:center;flex-shrink:0">'+(done?'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>':'')+'</div><div style="flex:1"><div style="font-size:14px;font-weight:600;color:'+(done?'var(--t3)':'var(--t1)')+';">'+(done?'<s>':'')+s.nom+(done?'</s>':'')+'</div>'+(s.adresse?'<div style="font-size:11px;color:var(--t2);margin-top:2px">'+s.adresse+'</div>':'')+'</div></div>';
  }).join('');
  el.innerHTML=h;
}
function toggleCheck(cId,sId){
  _circuitChecks[sId]=!_circuitChecks[sId];
  const c=circuits.find(c=>c.id===cId);if(c)renderCircuitChecklist(c);
}
function closeCircuitActif(){document.getElementById('circuit-actif-modal').style.display='none';_circuitChecks={};}

function renderRondes(){
  const el=document.getElementById('rondes-list');
  if(!circuits.length){el.innerHTML='<div class="empty">Aucun circuit. Cree-en un avec le bouton + en haut.</div>';return;}
  el.innerHTML=circuits.map(c=>{
    const open=openCircuits.has(c.id);
    let h='<div class="circuit-card"><div class="circuit-head"><div onclick="togCircuit('+c.id+')" style="cursor:pointer;flex:1"><div class="circuit-title">'+c.name+'</div><div class="circuit-meta">'+c.sites.length+' site'+(c.sites.length>1?'s':'')+'</div></div>';
    h+='<div style="display:flex;align-items:center;gap:7px">';
    h+='<button onclick="lancerCircuit('+c.id+')" style="background:rgba(34,197,94,0.1);border:none;border-radius:9px;color:#22c55e;font-size:12px;font-weight:600;padding:7px 13px;cursor:pointer">Lancer</button>';
    h+='<button onclick="togCircuit('+c.id+')" style="background:var(--s2);border:none;border-radius:9px;color:var(--t3);font-size:13px;padding:7px 10px;cursor:pointer">'+(open?'v':'+')+'</button>';
    h+='<button onclick="deleteCircuit('+c.id+')" style="background:rgba(255,68,68,0.08);border:none;border-radius:8px;color:var(--re);font-size:14px;padding:5px 10px;cursor:pointer">x</button>';
    h+='</div></div>';
    if(open){
      h+='<div class="circuit-body">';
      if(c.sites.length){
        c.sites.forEach(s=>{
          const codes=s.codes?s.codes.split(',').map(x=>x.trim()).filter(Boolean):[];
          h+='<div class="site-row"><div style="flex:1;min-width:0"><div class="site-name">'+s.nom+'</div>';
          if(s.adresse)h+='<div class="site-addr">'+s.adresse+'</div>';
          if(codes.length)h+='<div class="site-codes">'+codes.map(c=>'<span class="code-chip">'+c+'</span>').join('')+'</div>';
          h+='</div><button onclick="deleteSite('+c.id+','+s.id+')" style="background:none;border:none;color:var(--t3);font-size:18px;cursor:pointer;flex-shrink:0">x</button></div>';
        });
      } else {
        h+='<div style="padding:14px 16px;font-size:13px;color:var(--t3)">Aucun site.</div>';
      }
      h+='<div style="padding:12px 16px;border-top:1px solid rgba(255,255,255,0.05)"><button onclick="showAddSite('+c.id+')" style="background:rgba(245,197,24,0.08);border:1px solid rgba(245,197,24,0.15);border-radius:10px;color:var(--acc);font-size:13px;font-weight:600;padding:9px 16px;cursor:pointer;width:100%">+ Ajouter un site</button></div></div>';
    }
    h+='</div>';return h;
  }).join('');
}

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2000);}

document.addEventListener('click',e=>{
  if(!e.target.closest('#f-lieu')&&!e.target.closest('#lieu-sug'))document.getElementById('lieu-sug').style.display='none';
  if(!e.target.closest('#f-pc')&&!e.target.closest('#pc-sug')){const ps=document.getElementById('pc-sug');if(ps)ps.style.display='none';}

document.getElementById('f-notes').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px';});
document.getElementById('f-codes').addEventListener('input',renderCodesPreview);

refreshBon();
restoreForm();
renderHisto();
